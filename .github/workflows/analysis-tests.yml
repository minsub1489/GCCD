name: Research data checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q analysis
      - name: Run replay tests
        run: python -m unittest discover -s analysis/tests -p 'test_*.py' -v
